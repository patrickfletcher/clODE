[project]
name = "clode"
description="A Python package for solving ordinary differential equations on the GPU using OpenCL"
dynamic = ["version"]
authors = [
    {name="Patrick Fletcher", email="patrick.allen.fletcher@gmail.com"},
]
requires-python = ">=3.10"
readme = "docs/README.md"
license = "MIT"
license-files = ["docs/LICENSE.md"]
dependencies = [
    "numpy>=2.0.2",
    "pyopencl>=2025.2",
]

maintainers = [
    {name="Patrick Fletcher", email="patrick.allen.fletcher@gmail.com"},
    {name="Wolf Byttner", email="wolf@byttner.org"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Environment :: GPU",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
docs = [
    "matplotlib>=3.8.0",
    "mkdocs>=1.6.0",
    "mkdocs-autorefs>=1.0.0",
    "mkdocstrings>=0.30.0",
    "mkdocstrings-python>=1.10.0",
    "pygments>=2.0.0",
    "pymdown-extensions>=10.0.0",
]
dev = [
    "build>=1.2.0",
    "matplotlib>=3.8.0",
    "mkdocs>=1.6.0",
    "mkdocs-autorefs>=1.0.0",
    "mkdocstrings>=0.30.0",
    "mkdocstrings-python>=1.10.0",
    "pygments>=2.0.0",
    "pymdown-extensions>=10.0.0",
    "pytest>=8.0.0",
    "twine>=5.0.0",
]

[project.urls]
Documentation = "https://patrickfletcher.github.io/clODE/"
Repository = "https://github.com/patrickfletcher/clODE"

[tool.setuptools.dynamic]
version = {attr = "clode.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["clode", "clode.*"]
exclude = ["clode.cpp", "clode.cpp.*"]

[tool.setuptools.package-data]
clode = [
    "py.typed",
    "kernels/*.cl",
    "kernels/observers/*.clh",
    "kernels/steppers/*.clh",
]

[build-system]
requires = [
    "setuptools>=75.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
addopts = "-ra"
markers = [
    "smoke: driver-independent packaging and frontend smoke checks",
    "frontend: frontend-facing conversion or API-surface tests",
    "runtime_api: public runtime and backend contract tests",
    "numerics: numerical regression tests against exact solutions or fixed expectations",
    "core_numerics: authoritative kernel-level numerical regression tests",
    "pyopencl_internal: focused tests for internal PyOpenCL support layers",
    "legacy_cpp_comparison: comparison tests that still rely on the legacy C++ wrapper backend",
    "release_gate: tests that should pass before publishing a release",
    "requires_opencl: tests that require an OpenCL runtime on the host",
    "slow: reserved marker for slower tests",
]
