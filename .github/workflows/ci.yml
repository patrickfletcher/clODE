name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-13
            python-version: "3.10"
          - os: macos-13
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux OpenCL loader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-libopencl1

      - name: Install smoke and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test] build twine

      - name: Run smoke bundle
        run: python tools/run_test_bundle.py smoke

      - name: Build distribution artifacts
        run: python -m build --outdir dist

      - name: Verify build metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify wheel import
        run: python -c "import clode; print(clode.__version__)"

  opencl-linux:
    name: OpenCL Runtime (Ubuntu, py3.12)
    runs-on: ubuntu-22.04
    env:
      CLODE_TEST_PLATFORM_ID: "0"
      CLODE_TEST_DEVICE_ID: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install OpenCL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clinfo ocl-icd-libopencl1 ocl-icd-opencl-dev pocl-opencl-icd

      - name: Inspect available OpenCL platforms
        run: clinfo -l

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Run Linux OpenCL bundle
        run: python tools/run_test_bundle.py opencl

  docs:
    name: Docs (Ubuntu, py3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux OpenCL loader
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-libopencl1

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[docs]

      - name: Build docs
        run: python -m mkdocs build --strict
