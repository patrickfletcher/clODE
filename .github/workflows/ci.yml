name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - pyopencl-backend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install smoke and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test] build twine
          python -m pip check

      - name: Run smoke bundle
        run: python tools/run_test_bundle.py smoke

      - name: Build distribution artifacts
        run: python -m build --outdir dist

      - name: Verify build metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify wheel import
        run: python -c "import clode; print(clode.__version__)"

  opencl-linux:
    name: Release Gate (Ubuntu PoCL, py3.12)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CLODE_TEST_PLATFORM_ID: "0"
      CLODE_TEST_DEVICE_ID: "0"
      POCL_KERNELLIB_NAME: "sse2"
      POCL_LLVM_CPU_NAME: "x86-64"
      POCL_KERNEL_CACHE: "0"
      PYOPENCL_COMPILER_OUTPUT: "1"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "pocl-binary-distribution==3.0"
          python -m pip check

      - name: Probe OpenCL runtime
        continue-on-error: true
        run: python tools/probe_opencl_runtime.py --traceback

      - name: Run release gate bundle
        run: |
          python tools/run_test_bundle.py release -- \
            -vv -s --maxfail=1 --full-trace --showlocals

  opencl-linux-intel:
    name: Release Gate Candidate (Ubuntu Intel CPU runtime, py3.12)
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 40
    env:
      CLODE_TEST_PLATFORM_ID: "0"
      CLODE_TEST_DEVICE_ID: "0"
      PYOPENCL_COMPILER_OUTPUT: "1"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Intel CPU OpenCL runtime environment
        run: |
          MINIFORGE_DIR="$RUNNER_TEMP/miniforge"
          INTEL_OPENCL_ENV_PREFIX="$RUNNER_TEMP/intel-opencl"
          echo "MINIFORGE_DIR=$MINIFORGE_DIR" >> "$GITHUB_ENV"
          echo "INTEL_OPENCL_ENV_PREFIX=$INTEL_OPENCL_ENV_PREFIX" >> "$GITHUB_ENV"
          curl -L -o "$RUNNER_TEMP/miniforge.sh" \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh"
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$MINIFORGE_DIR"
          "$MINIFORGE_DIR/bin/conda" create -y -p "$INTEL_OPENCL_ENV_PREFIX" \
            -c conda-forge python=3.12 pip pyopencl intel-opencl-rt
          "$MINIFORGE_DIR/bin/conda" run -p "$INTEL_OPENCL_ENV_PREFIX" \
            python -m pip install --upgrade pip
          "$MINIFORGE_DIR/bin/conda" run -p "$INTEL_OPENCL_ENV_PREFIX" \
            python -m pip install ".[test]"
          "$MINIFORGE_DIR/bin/conda" run -p "$INTEL_OPENCL_ENV_PREFIX" \
            python -m pip check

      - name: Probe Intel OpenCL runtime
        continue-on-error: true
        run: |
          "$MINIFORGE_DIR/bin/conda" run -p "$INTEL_OPENCL_ENV_PREFIX" \
            python tools/probe_opencl_runtime.py --traceback

      - name: Run Intel release gate bundle
        run: |
          "$MINIFORGE_DIR/bin/conda" run -p "$INTEL_OPENCL_ENV_PREFIX" \
            python tools/run_test_bundle.py release -- \
            -vv -s --maxfail=1 --full-trace --showlocals

  opencl-macos:
    name: Release Gate (macOS OpenCL, py3.12)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CLODE_TEST_PLATFORM_ID: "0"
      CLODE_TEST_DEVICE_ID: "0"
      PYOPENCL_COMPILER_OUTPUT: "1"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip check

      - name: Probe OpenCL runtime
        continue-on-error: true
        run: python tools/probe_opencl_runtime.py --traceback

      - name: Run release gate bundle
        run: |
          python tools/run_test_bundle.py release -- \
            -vv -s --maxfail=1 --full-trace --showlocals

  docs:
    name: Docs (Ubuntu, py3.12)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    timeout-minutes: 15
    env:
      POCL_KERNELLIB_NAME: "sse2"
      POCL_LLVM_CPU_NAME: "x86-64"
      POCL_KERNEL_CACHE: "0"
      PYOPENCL_COMPILER_OUTPUT: "1"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]" "pocl-binary-distribution==3.0"
          python -m pip check

      - name: Inspect available OpenCL platforms
        run: |
          python -c "import clode; print(clode.query_opencl())"

      - name: Build docs
        run: python -m mkdocs build --strict
