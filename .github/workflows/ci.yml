name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - pyopencl-backend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install smoke and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test] build twine
          python -m pip check

      - name: Run smoke bundle
        run: python tools/run_test_bundle.py smoke

      - name: Build distribution artifacts
        run: python -m build --outdir dist

      - name: Verify build metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify wheel import
        run: python -c "import clode; print(clode.__version__)"

  opencl-linux:
    name: Release Gate (Linux PoCL, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLODE_TEST_PLATFORM_ID: "0"
      CLODE_TEST_DEVICE_ID: "0"
      POCL_KERNELLIB_NAME: "sse2"
      POCL_LLVM_CPU_NAME: "x86-64"
      POCL_KERNEL_CACHE: "0"
      PYOPENCL_COMPILER_OUTPUT: "1"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "pocl-binary-distribution==3.0"
          python -m pip check

      - name: Probe PoCL runtime
        run: python tools/probe_opencl_runtime.py

      - name: Run release gate bundle
        run: python tools/run_test_bundle.py release

  docs:
    name: Docs (Ubuntu, py3.12)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    timeout-minutes: 15
    env:
      POCL_KERNELLIB_NAME: "sse2"
      POCL_LLVM_CPU_NAME: "x86-64"
      POCL_KERNEL_CACHE: "0"
      PYOPENCL_COMPILER_OUTPUT: "1"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]" "pocl-binary-distribution==3.0"
          python -m pip check

      - name: Inspect available OpenCL platforms
        run: |
          python -c "import clode; print(clode.query_opencl())"

      - name: Build docs
        run: python -m mkdocs build --strict
