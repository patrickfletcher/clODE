name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - pyopencl-backend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install smoke and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test] build twine
          python -m pip check

      - name: Run smoke bundle
        run: python tools/run_test_bundle.py smoke

      - name: Build distribution artifacts
        run: python -m build --outdir dist

      - name: Verify build metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify wheel import
        run: python -c "import clode; print(clode.__version__)"

  opencl-linux:
    name: Release Gate (Ubuntu PyPI PoCL, py3.12)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CLODE_TEST_PLATFORM_ID: "0"
      CLODE_TEST_DEVICE_ID: "0"
      POCL_KERNELLIB_NAME: "sse2"
      POCL_LLVM_CPU_NAME: "x86-64"
      POCL_KERNEL_CACHE: "0"
      PYOPENCL_COMPILER_OUTPUT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime test dependencies
        run: |
          sudo apt install -y intel-opencl-icd
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip check

      - name: Inspect installed OpenCL runtime
        run: |
          python -m pip list | grep -Ei '^(pyopencl|pocl|opencl|ocl|llvm)' || true
          python - <<'PY'
          import os

          import clode
          import pyopencl as cl
          import pyopencl._cl as cl_module

          print(f"PYOPENCL_MODULE={cl_module.__file__}")
          print("RELEVANT_ENV=")
          for key in (
            "CLODE_TEST_PLATFORM_ID",
            "CLODE_TEST_DEVICE_ID",
            "POCL_KERNELLIB_NAME",
            "POCL_LLVM_CPU_NAME",
            "POCL_KERNEL_CACHE",
            "PYOPENCL_COMPILER_OUTPUT",
          ):
            print(f"  {key}={os.environ.get(key)}")
          print("OPENCL_QUERY=")
          print(clode.query_opencl())
          for platform_index, platform in enumerate(cl.get_platforms()):
            print(f"PLATFORM[{platform_index}] {platform.name} :: {platform.version}")
            for device_index, device in enumerate(platform.get_devices()):
              print(
                f"  DEVICE[{device_index}] {device.name} :: "
                f"vendor={device.vendor} :: driver={device.driver_version} :: "
                f"version={device.version}"
              )
          PY

      - name: Probe OpenCL compiler
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import traceback

          import numpy as np
          import pyopencl as cl
          import pyopencl.tools

          platform = cl.get_platforms()[int(os.environ["CLODE_TEST_PLATFORM_ID"])]
          device = platform.get_devices()[int(os.environ["CLODE_TEST_DEVICE_ID"])]
          print(f"SELECTED_PLATFORM={platform.name} :: {platform.version}")
          print(f"SELECTED_DEVICE={device.name} :: {device.driver_version}")

          context = cl.Context([device])
          source = """
          typedef struct {
            float value;
            unsigned int count;
          } diagnostic_struct;

          __kernel void add_one(__global float *x) {
            const size_t i = get_global_id(0);
            x[i] += 1.0f;
          }
          """

          program = cl.Program(context, source)
          try:
            program.build()
            print("MINIMAL_PROGRAM_BUILD=ok")
          except Exception as exc:
            print(f"MINIMAL_PROGRAM_BUILD=failed: {exc}")
            try:
              print(program.get_build_info(device, cl.program_build_info.LOG))
            except Exception as build_log_exc:
              print(f"BUILD_LOG_UNAVAILABLE={build_log_exc}")
            traceback.print_exc()

          dtype = np.dtype([("value", np.float32), ("count", np.uint32)], align=True)
          try:
            matched_dtype, declaration = pyopencl.tools.match_dtype_to_c_struct(
              device, "diagnostic_struct", dtype
            )
            print(f"MATCHED_DTYPE={matched_dtype}")
            print("MATCHED_DECLARATION=")
            print(declaration)
          except Exception as exc:
            print(f"MATCH_DTYPE=failed: {exc}")
            traceback.print_exc()
          PY

      - name: Run release gate bundle
        run: python tools/run_test_bundle.py release

  docs:
    name: Docs (Ubuntu, py3.12)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: |
          sudo apt install -y intel-opencl-icd
          python -m pip install --upgrade pip
          python -m pip install .[docs]

      - name: Build docs
        run: python -m mkdocs build --strict
